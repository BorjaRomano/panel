<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel de casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2f7d5b">
<style id="base">
/* Los colores var(--x) los rellena applyTheme(); en navegadores sin variables CSS (Android 5) los sustituye en el texto */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;display:-webkit-box;display:-webkit-flex;display:flex;overflow:hidden}
button{font:inherit;color:inherit}
nav{width:104px;background:var(--card);border-right:1px solid var(--line);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;align-items:stretch;padding:8px 0;overflow-y:auto}
nav .nc{text-align:center;font-size:22px;font-weight:700;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
nav button{background:none;border:0;padding:10px 4px;display:block;width:100%;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;border-left:4px solid transparent}
nav button .i{display:block;font-size:26px;line-height:32px}
nav button.on{color:var(--acc);border-left-color:var(--acc);background:var(--acc2);font-weight:700}
main{-webkit-flex:1;flex:1;overflow-y:auto;padding:20px 24px;-webkit-overflow-scrolling:touch}
h2{margin:0 0 14px;font-size:24px}
h3{margin:0 0 10px;font-size:17px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -8px}
.row>*{margin-left:8px;margin-right:8px}
.f1{-webkit-flex:1;flex:1;min-width:260px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;font-size:15px}
body.dark .btn{color:#0d1f16}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.sm{padding:10px 16px;font-size:15px}
.mute{color:var(--mute)}
.small{font-size:13px}
.top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:12px}
.top>*{margin-bottom:6px}
/* inicio */
.clock{font-size:120px;font-weight:300;line-height:1;letter-spacing:-.02em}
.date{font-size:26px;margin:6px 0 20px;color:var(--mute)}
.wxnow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.wxnow .e{font-size:64px;margin-right:16px}
.wxnow .t{font-size:48px;font-weight:300}
.wxdays{display:-webkit-flex;display:flex;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.wxdays div{-webkit-flex:1;flex:1;text-align:center;font-size:14px}
.wxdays .e{font-size:28px;display:block;margin:2px 0}
.wxhours{display:-webkit-flex;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.wxhours div{-webkit-flex:1 1 0;flex:1 1 0;min-width:0;text-align:center;font-size:14px;padding:0 1px;white-space:nowrap}
.wxhours .e{font-size:22px;display:block;margin:4px 0}
.meal{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.meal:last-child{border-bottom:0}
.meal .k{width:96px;color:var(--mute);font-size:14px}
.meal .n{-webkit-flex:1;flex:1;font-size:18px}
.tip{background:var(--acc2);border-color:transparent}
/* Inicio: filas de dos celdas; la tarjeta de cada celda ocupa toda la altura de la fila */
.hrow{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -8px 12px}
.hrow:last-child{margin-bottom:0}
.hrow .card{padding:14px 16px}
.hrow .card h3{margin-bottom:6px}
.hrow .meal{padding:6px 0}
.hrow .rt{padding:10px 12px;margin:0 6px 6px 0;min-width:0;width:calc(33.33% - 6px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .clock{font-size:110px}
.hc{-webkit-flex:1;flex:1;min-width:300px;margin:0 8px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.hc>.card{-webkit-flex:1;flex:1;margin-bottom:0}
.hclock{-webkit-justify-content:center;justify-content:center}
.hclock .date{margin-bottom:0}
.hrow.tall .hc>.card{min-height:280px}
/* La fila del tiempo y los eventos crece hasta llenar la pantalla disponible */
.home{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:100%}
.home>.hrow.tall{-webkit-flex:1 0 auto;flex:1 0 auto}
#wx{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
#wxh{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#wxh .wxhours{margin-top:auto;margin-bottom:auto}
.hcalc{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
iframe.hcal{-webkit-flex:1;flex:1;min-height:150px;display:block}
.meal.shop{border-bottom:0}
.meal.shop .k{color:var(--acc);font-weight:600}
.big{font-size:34px;font-weight:700}
/* menú */
table.wk{width:100%;border-collapse:separate;border-spacing:0 6px}
table.wk th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:0 8px}
table.wk td{background:var(--card);padding:8px;vertical-align:top;font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.wk td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px;font-weight:700;width:90px}
table.wk td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0;width:80px;text-align:right;color:var(--mute)}
table.wk tr.today td{background:var(--acc2);border-color:var(--acc)}
.cell{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start}
.cell .n{-webkit-flex:1;flex:1;cursor:pointer;padding-right:4px}
.sw{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--mute);font-size:16px;-webkit-flex:none;flex:none}
.chips span{display:inline-block;padding:6px 12px;border-radius:20px;margin:0 6px 6px 0;font-size:14px;background:var(--acc2);color:var(--acc)}
.chips span.bad{background:var(--warn2);color:var(--warn)}
ul.tips{margin:6px 0 0;padding-left:20px}
ul.tips li{margin-bottom:6px}
/* recetas */
.rgrid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -6px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px;width:calc(33.33% - 12px);min-width:200px;cursor:pointer;-webkit-flex-grow:1;flex-grow:1}
.rc b{display:block;margin-bottom:4px}
.seg{display:inline-block;margin-bottom:12px}
.seg button{background:var(--card);border:1px solid var(--line);padding:8px 14px;cursor:pointer;margin-right:-1px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=text],input[type=number],input[type=email],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px}
/* compra */
.sec-h{font-weight:700;margin:14px 0 4px;color:var(--acc)}
.it{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.it .bx{width:26px;height:26px;border:2px solid var(--mute);border-radius:7px;margin-right:12px;text-align:center;line-height:22px;font-weight:700;-webkit-flex:none;flex:none}
.it.done .bx{background:var(--acc);border-color:var(--acc);color:#fff}
.it.done .nm{text-decoration:line-through;color:var(--mute)}
.it .nm{-webkit-flex:1;flex:1;font-size:17px}
.it .q{color:var(--mute);margin-left:8px}
.it .x{background:none;border:0;color:var(--mute);font-size:20px;padding:0 8px;cursor:pointer}
.cols2{-webkit-column-count:2;column-count:2;-webkit-column-gap:32px;column-gap:32px}
.cols2 .grp{-webkit-column-break-inside:avoid;break-inside:avoid;display:inline-block;width:100%}
/* música */
.pl{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pl .n{-webkit-flex:1;flex:1;font-size:18px}
.pl .btn{margin-left:8px}
iframe{border:0;width:100%;border-radius:12px;background:var(--card)}
.rt{position:relative;display:inline-block;background:var(--acc2);color:var(--acc);border:1px solid transparent;border-radius:12px;padding:14px 16px;margin:0 8px 8px 0;font-weight:600;font-size:16px;cursor:pointer;min-width:150px;text-align:left}
.rt.on{background:var(--acc);color:#fff}
body.dark .rt.on{color:#0d1f16}
.rt.ed{cursor:default;padding:6px 6px;display:inline-block}
.rt.ed .nm{display:inline-block;vertical-align:middle;margin:0 6px;min-width:90px}
.rt.ed .mv{vertical-align:middle;background:var(--card);color:var(--acc);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:22px;line-height:1;cursor:pointer}
.rt.ed .mv[disabled]{opacity:.3;cursor:default}
.rt.ed .rx{position:static;display:inline-block;vertical-align:middle;margin-left:6px;width:40px;height:40px;line-height:40px;border-radius:8px;font-size:16px}
.rt .rx{cursor:pointer;position:absolute;top:-8px;right:-8px;background:var(--warn);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px}
#player{position:fixed;right:20px;bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;z-index:8}
#player .pe{font-size:26px;vertical-align:middle;margin-right:8px}
#player .pn{display:inline-block;vertical-align:middle;margin-right:12px;max-width:220px}
#player .btn{vertical-align:middle}
/* ajustes */
label.l{display:block;font-weight:600;margin:14px 0 6px}
.chk{display:inline-block;margin:0 14px 8px 0;font-size:15px}
.chk input{width:20px;height:20px;vertical-align:middle;margin-right:4px}
/* modal */
#ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:9;padding:20px}
#ov.on{display:-webkit-flex;display:flex}
#md{background:var(--card);border-radius:16px;max-width:900px;width:100%;max-height:100%;overflow-y:auto;padding:22px 24px}
#md ol{padding-left:22px}
#md ol li{margin-bottom:8px;line-height:1.4}
#md ul{padding-left:20px;margin-top:0}
#md ul li{margin-bottom:4px}
#toast{position:fixed;bottom:20px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:10}
@media (max-width:760px){
  body{-webkit-flex-direction:column-reverse;flex-direction:column-reverse}
  nav{width:auto;-webkit-flex-direction:row;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:0;overflow-x:auto}
  nav .nc{display:none}
  nav button{border-left:0;border-top:3px solid transparent;font-size:11px;padding:6px 2px}
  nav button.on{border-top-color:var(--acc)}
  main{padding:16px}
  .clock{font-size:80px}
  .cols2{-webkit-column-count:1;column-count:1}
  .rc{width:100%}
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<div id="ov"><div id="md"></div></div>
<div id="toast"></div>
<div id="player"></div>
<audio id="au" preload="none"></audio>
<script>
(function () {
'use strict';

/* ---------- Recetas ----------
   i: [ingrediente, cantidad por persona, unidad, sección]; cantidad 0 = al gusto
   Secciones: V verdura/fruta, C carne, P pescado, L lácteos/huevos, D despensa, N panadería, F congelados, B básicos */
var AOVE = 'Aceite de oliva virgen extra';
var R = [
 {id:'d1',t:'d',n:'Tostada integral con tomate y café con leche',k:350,m:5,g:['gluten','lactosa'],i:[['Pan integral',60,'g','N'],['Tomate',1,'ud','V'],['Leche semidesnatada',200,'ml','L'],[AOVE,10,'ml','B'],['Café',0,'ud','B']],s:['Tuesta el pan.','Ralla el tomate y extiéndelo sobre el pan con un chorrito de aceite.','Acompaña con un café con leche.']},
 {id:'d2',t:'d',n:'Yogur natural con plátano y avena',k:320,m:5,g:['lactosa','gluten'],i:[['Yogur natural',2,'ud','L'],['Plátano',1,'ud','V'],['Copos de avena',30,'g','D'],['Canela',0,'ud','B']],s:['Pon los yogures en un bol.','Añade el plátano en rodajas y los copos de avena.','Espolvorea canela al gusto.']},
 {id:'d3',t:'d',n:'Tostada de aguacate y huevo',k:400,m:10,g:['gluten','huevo'],i:[['Pan integral',60,'g','N'],['Aguacate',0.5,'ud','V'],['Huevos',1,'ud','L'],[AOVE,5,'ml','B'],['Sal y pimienta',0,'ud','B']],s:['Cuece el huevo 9 minutos o hazlo a la plancha.','Machaca el aguacate con sal y pimienta y extiéndelo sobre el pan tostado.','Coloca el huevo encima.']},
 {id:'d4',t:'d',n:'Porridge de avena con manzana y canela',k:360,m:10,g:['gluten','lactosa'],i:[['Copos de avena',40,'g','D'],['Leche semidesnatada',250,'ml','L'],['Manzana',1,'ud','V'],['Canela',0,'ud','B']],s:['Calienta la leche con la avena a fuego medio 5 minutos, removiendo.','Añade la manzana troceada y la canela.','Deja reposar un minuto y sirve.']},
 {id:'d5',t:'d',n:'Batido de plátano y frutos rojos',k:300,m:5,g:['lactosa'],i:[['Leche semidesnatada',200,'ml','L'],['Plátano',1,'ud','V'],['Frutos rojos congelados',80,'g','F']],s:['Tritura todo en la batidora hasta que quede cremoso.','Si lo quieres más espeso, añade medio yogur.']},
 {id:'d6',t:'d',n:'Tortitas de arroz con queso fresco y pavo',k:280,m:5,g:['lactosa','carne'],i:[['Tortitas de arroz',3,'ud','D'],['Queso fresco',60,'g','L'],['Pechuga de pavo en lonchas',50,'g','C'],['Tomate',0.5,'ud','V']],s:['Unta las tortitas con el queso fresco.','Añade el pavo y unas rodajas de tomate.']},
 {id:'d7',t:'d',n:'Fruta de temporada con nueces',k:250,m:3,g:['frutos_secos'],i:[['Fruta de temporada',2,'ud','V'],['Nueces peladas',25,'g','D']],s:['Lava y trocea la fruta.','Acompaña con un puñado de nueces y una infusión.']},
 {id:'d8',t:'d',n:'Huevos revueltos con tomate y fruta',k:330,m:10,g:['huevo'],i:[['Huevos',2,'ud','L'],['Tomate',1,'ud','V'],['Fruta de temporada',1,'ud','V'],[AOVE,5,'ml','B']],s:['Saltea el tomate picado un par de minutos.','Añade los huevos batidos y remueve hasta que cuajen.','Termina con una pieza de fruta.']},

 {id:'c1',t:'c',n:'Lentejas estofadas con verduras',k:450,m:45,g:['legumbre'],i:[['Lentejas pardinas',80,'g','D'],['Zanahoria',1,'ud','V'],['Patata',1,'ud','V'],['Cebolla',0.5,'ud','V'],['Pimiento verde',0.5,'ud','V'],['Ajo',1,'diente','V'],['Pimentón dulce',0,'ud','B'],['Laurel',0,'ud','B'],[AOVE,10,'ml','B']],s:['Sofríe la cebolla, el ajo y el pimiento picados en el aceite.','Añade la zanahoria en rodajas, el pimentón y las lentejas lavadas.','Cubre con agua, pon el laurel y cuece 25 minutos.','Incorpora la patata troceada y cuece 15 minutos más. Ajusta de sal.']},
 {id:'c2',t:'c',n:'Garbanzos con espinacas',k:420,m:20,g:['legumbre'],i:[['Garbanzos cocidos',200,'g','D'],['Espinacas frescas',100,'g','V'],['Ajo',2,'diente','V'],['Comino',0,'ud','B'],['Pimentón dulce',0,'ud','B'],[AOVE,15,'ml','B']],s:['Dora el ajo laminado en el aceite.','Añade las espinacas y saltea hasta que se ablanden.','Incorpora el pimentón, el comino y los garbanzos escurridos.','Añade un poco de agua y cuece 5 minutos.']},
 {id:'c3',t:'c',n:'Fabes con almejas',k:520,m:150,g:['legumbre','pescado'],i:[['Fabes',80,'g','D'],['Almejas',100,'g','P'],['Cebolla',0.5,'ud','V'],['Ajo',1,'diente','V'],['Perejil',0,'ud','V'],['Azafrán',0,'ud','B'],[AOVE,10,'ml','B']],s:['Pon las fabes en remojo la noche anterior.','Cuécelas a fuego suave con la cebolla y el ajo unas 2 horas, «asustándolas» con un chorrito de agua fría de vez en cuando.','Abre las almejas en una sartén y añádelas con su jugo y el azafrán.','Cuece 10 minutos más y espolvorea perejil.']},
 {id:'c4',t:'c',n:'Pollo al horno con patatas y verduras',k:550,m:60,g:['carne'],i:[['Muslos de pollo',250,'g','C'],['Patata',1,'ud','V'],['Cebolla',0.5,'ud','V'],['Pimiento rojo',0.5,'ud','V'],['Limón',0.5,'ud','V'],['Ajo',1,'diente','V'],['Romero',0,'ud','B'],[AOVE,15,'ml','B']],s:['Precalienta el horno a 200 °C.','Pon en una bandeja la patata en rodajas y la cebolla y el pimiento en tiras.','Coloca encima el pollo salpimentado con ajo, romero, limón y aceite.','Hornea 50 minutos, dando la vuelta al pollo a mitad.']},
 {id:'c5',t:'c',n:'Merluza en salsa verde con patatas',k:420,m:30,g:['pescado','gluten'],i:[['Merluza',180,'g','P'],['Patata',1,'ud','V'],['Ajo',2,'diente','V'],['Perejil',0,'ud','V'],['Caldo de pescado',150,'ml','D'],['Harina',0,'ud','B'],[AOVE,15,'ml','B']],s:['Cuece la patata en rodajas 15 minutos.','Dora el ajo picado, añade una cucharadita de harina y luego el caldo poco a poco.','Incorpora la merluza y cuece 5–6 minutos moviendo la cazuela.','Añade perejil picado y sirve con la patata.']},
 {id:'c6',t:'c',n:'Arroz con pollo y verduras',k:520,m:40,g:['carne'],i:[['Arroz',80,'g','D'],['Pechuga de pollo',120,'g','C'],['Judías verdes',80,'g','V'],['Pimiento rojo',0.5,'ud','V'],['Tomate triturado',100,'g','D'],['Ajo',1,'diente','V'],['Azafrán',0,'ud','B'],[AOVE,10,'ml','B']],s:['Dora el pollo troceado y resérvalo.','Sofríe el ajo, el pimiento y las judías; añade el tomate.','Incorpora el arroz, el pollo y el doble de agua que de arroz.','Cuece 18 minutos y deja reposar 5.']},
 {id:'c7',t:'c',n:'Pasta integral con atún y tomate',k:520,m:20,g:['gluten','pescado'],i:[['Pasta integral',80,'g','D'],['Atún en lata',1,'lata','D'],['Tomate triturado',150,'g','D'],['Cebolla',0.5,'ud','V'],['Orégano',0,'ud','B'],[AOVE,10,'ml','B']],s:['Cuece la pasta según el paquete.','Pocha la cebolla, añade el tomate y cocina 10 minutos.','Incorpora el atún escurrido y el orégano.','Mezcla con la pasta.']},
 {id:'c8',t:'c',n:'Salmón a la plancha con quinoa y brócoli',k:560,m:25,g:['pescado'],i:[['Salmón',150,'g','P'],['Quinoa',60,'g','D'],['Brócoli',150,'g','V'],['Limón',0.25,'ud','V'],[AOVE,10,'ml','B']],s:['Lava la quinoa y cuécela 15 minutos.','Cuece el brócoli al vapor 6–7 minutos.','Haz el salmón a la plancha 3–4 minutos por lado.','Sirve con un chorrito de limón.']},

  var days = S.plan.days, cur = days[di][slot], cands = pool(slot).filter(function (r) { return r.id !== cur; });
  if (!cands.length) { toast('No hay más recetas compatibles'); return; }

  var scored = cands.map(function (r) {

}

/* ---------- Tiempo ---------- */
function wmo(c) {
  // Solo emojis de Unicode 6, que Android 5 sí dibuja
  if (c === 0) return ['☀️','Despejado'];
  if (c === 1) return ['☀️','Poco nuboso'];
  if (c === 2) return ['⛅','Intervalos nubosos'];
  if (c === 3) return ['☁️','Nublado'];
  if (c === 45 || c === 48) return ['🌁','Niebla'];
  if (c >= 51 && c <= 57) return ['☔','Llovizna'];
  if (c >= 61 && c <= 67) return ['☔','Lluvia'];
  if (c >= 71 && c <= 77) return ['⛄','Nieve'];
  if (c >= 80 && c <= 82) return ['☔','Chubascos'];
  if (c === 85 || c === 86) return ['⛄','Chubascos de nieve'];
  if (c >= 95) return ['⚡','Tormenta'];
  return ['☁️',''];
}
// De noche, cielo despejado = luna (is_day ausente en datos antiguos guardados = de día)
function wxIcon(code, isDay) {

  return wmo(code)[0];
}
function fetchWx() {

    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&hourly=temperature_2m,weather_code,precipitation_probability,is_day&forecast_hours=14&timezone=Europe%2FMadrid&forecast_days=5',
    function (j) { wx = {t: Date.now(), d: j, city: c.name}; S.wx = wx; save(); renderWx(); },
    function () { renderWx(true); });
}
function renderWx(failed) {
  var el = $('wx'); if (!el) return;
  if (!wx || !wx.d || !wx.d.current) { el.innerHTML = failed ? '<span class="mute">No se ha podido cargar el tiempo. Lo reintentaré en unos minutos.</span>' : '<span class="mute">Cargando el tiempo…</span>'; renderHours(); return; }
  var cur = wx.d.current, dl = wx.d.daily, w = wmo(cur.weather_code), h = '';
  h += '<h3>' + esc(wx.city) + '</h3><div class="wxnow"><span class="e">' + wxIcon(cur.weather_code, cur.is_day) + '</span><div><div class="t">' + Math.round(cur.temperature_2m) + '°</div>' +
    '<div class="mute">' + w[1] + ' · sensación ' + Math.round(cur.apparent_temperature) + '° · viento ' + Math.round(cur.wind_speed_10m) + ' km/h</div></div></div><div class="wxdays">';
  for (var i = 0; i < dl.time.length; i++) {
    var p = dl.time[i].split('-'), dd = new Date(+p[0], +p[1] - 1, +p[2]), e = wmo(dl.weather_code[i]);
    h += '<div><b>' + (i === 0 ? 'Hoy' : DIAS[dd.getDay()].slice(0, 3)) + '</b><span class="e">' + e[0] + '</span>' +
      Math.round(dl.temperature_2m_max[i]) + '° <span class="mute">' + Math.round(dl.temperature_2m_min[i]) + '°</span>' +
      (dl.precipitation_probability_max[i] != null ? '<br><span class="mute small">💧 ' + dl.precipitation_probability_max[i] + '%</span>' : '') + '</div>';
  }

function renderHours() {
  var el = $('wxh'); if (!el) return;
  var hr = wx && wx.d && wx.d.hourly;
  var wait = '<h3>Próximas horas</h3><span class="mute">Cargando la previsión…</span>';
  if (!hr || !hr.time) { el.innerHTML = wait; return; }
  // Las horas vienen en hora local ("2026-10-23T08:00"): se descartan las ya pasadas comparando el texto
  // Tantas horas como quepan a ~46 px cada una (entre 6 y 12)
  var d = new Date(), now = ymd(d) + 'T' + pad(d.getHours()) + ':00', h = '', n = 0;
  var max = Math.max(6, Math.min(12, Math.floor((el.clientWidth - 32) / 46)));
  for (var i = 0; i < hr.time.length && n < max; i++) {
    if (hr.time[i] < now) continue;
    var e = wxIcon(hr.weather_code[i], hr.is_day[i]), pp = hr.precipitation_probability[i];
    h += '<div><b>' + (n === 0 ? 'Ahora' : hr.time[i].slice(11, 13) + 'h') + '</b><span class="e">' + e + '</span>' + Math.round(hr.temperature_2m[i]) + '°' +
      '<br><span class="mute small">' + (pp != null ? '💧' + pp + '%' : '') + '</span></div>';
    n++;
  }
  if (!n) { el.innerHTML = wait; return; }
  el.innerHTML = '<h3>Próximas horas</h3><div class="wxhours">' + h + '</div>';
}

  TAGS.forEach(function (t) { h += '<label class="chk"><input type="checkbox" class="cx" value="' + t[0] + '"' + (has(c.excl, t[0]) ? ' checked' : '') + '>' + t[1] + '</label>'; });
  h += '</div></div><div class="f1"><div class="card"><h3>Tiempo</h3><label class="l">Ciudad: <b>' + esc(c.city.name) + '</b></label><div class="row"><input type="text" id="cc" class="f1" placeholder="Buscar otra ciudad"><button class="btn sec" data-a="city">Buscar</button></div></div>';
  h += '<div class="card"><h3>Calendario</h3><label class="l">Tu Gmail (Google Calendar)</label><input type="email" id="cg" placeholder="nombre@gmail.com" value="' + esc(c.gcal) + '"></div>';
  h += '<div class="card"><h3>Pantalla</h3><label class="l">Tema</label><select id="ct">';
  [['auto','Automático (oscuro de 21:00 a 8:00)'],['light','Siempre claro'],['dark','Siempre oscuro']].forEach(function (o) { h += '<option value="' + o[0] + '"' + (c.theme === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; });
  h += '</select><label class="l">Mantener la pantalla encendida</label><select id="cw">';
  [['always','Siempre'],['radio','Solo mientras suena la radio'],['never','No (se apaga como siempre)']].forEach(function (o) { h += '<option value="' + o[0] + '"' + (c.wake === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; });
  h += '</select>' + (navigator.wakeLock ? '' : '<div class="mute small">Este navegador no permite mantener la pantalla encendida; usa Firefox.</div>') +
    '<label class="chk" style="margin-top:14px"><input type="checkbox" id="cfs"' + (c.autofs ? ' checked' : '') + '>Volver a pantalla completa al tocar el panel</label>' +
    '<div style="margin-top:6px"><button class="btn sec" data-a="fs">Pantalla completa</button></div></div></div></div>';
  return h + '<button class="btn" data-a="savecfg" style="font-size:18px;padding:14px 28px">Guardar ajustes</button>';
}

function render() {
  ensurePlan();
  applyTheme();
  renderNav();
  var fn = {home:vHome,menu:vMenu,recetas:vRecetas,compra:vCompra,musica:vMusica,cal:vCal,cfg:vCfg}[view];
  $('main').innerHTML = fn();
  if (view === 'home') renderWx();
}

/* ---------- Modal de receta ---------- */
function openRecipe(id, di, slot) {
  var r = BYID[id]; if (!r) return;
  var f = factor(), ppl = S.cfg.people;
  var h = '<div class="top"><h2 style="margin:0">' + esc(r.n) + '</h2><button class="btn sec" data-a="close">Cerrar ✕</button></div>';
  h += '<p class="mute">🕒 ' + r.m + ' min · 🔥 ' + Math.round(r.k * f) + ' kcal por ración · para ' + ppl + ' persona' + (ppl > 1 ? 's' : '') + '</p><div class="row"><div class="f1"><h3>Ingredientes</h3><ul>';
  r.i.forEach(function (x) { var q = fmtQty(x[1] * f * ppl, x[2]); h += '<li>' + esc(x[0]) + (q ? ' — <b>' + q + '</b>' : ' <span class="mute">(al gusto)</span>') + '</li>'; });
  h += '</ul></div><div class="f1" style="min-width:320px"><h3>Preparación</h3><ol>';
  r.s.forEach(function (s) { h += '<li>' + esc(s) + '</li>'; });
  h += '</ol></div></div>';
  if (di != null) h += '<button class="btn sec" data-a="swapm:' + di + ':' + slot + '">↻ Cambiar este plato en el menú</button>';
  $('md').innerHTML = h;
  $('ov').className = 'on';
}
function closeModal() { $('ov').className = ''; }

/* ---------- Eventos ---------- */
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement); }
function goFull() {
  var de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen;
  if (rq) { try { var pr = rq.call(de); if (pr && pr.catch) pr.catch(function () {}); } catch (err) {} }
}
document.addEventListener('click', function (e) {
  var t = e.target;
  // Ninguno de estos extras debe poder cortar la acción del toque
  try { updateWake(); } catch (err) {}
  // El navegador solo deja entrar en pantalla completa tras un toque: se aprovecha cualquiera
  try { if (S.cfg.autofs && !isFull()) goFull(); } catch (err) {}
  if (t.id === 'ov') { closeModal(); return; }
  while (t && t.nodeType === 1 && !t.getAttribute('data-a')) t = t.parentNode;
  if (!t || t.nodeType !== 1) return;
  var a = t.getAttribute('data-a'), p = a.split(':'), cmd = p[0];
  if (!cmd) return;
  e.stopPropagation();
  if (cmd === 'nav') { view = p[1]; closeModal(); render(); $('main').scrollTop = 0; }
  else if (cmd === 'open') openRecipe(p[1], p[2], p[3]);
  else if (cmd === 'close') closeModal();
  else if (cmd === 'swap') { swap(+p[1], p[2]); render(); }
  else if (cmd === 'swapm') { swap(+p[1], p[2]); closeModal(); render(); toast('Plato cambiado'); }
  else if (cmd === 'gen') { genPlan(); render(); toast('Menú nuevo generado'); }
  else if (cmd === 'rf') { recFilter = p[1]; render(); }
  else if (cmd === 'chk') { var k = a.slice(4); if (S.checked[k]) delete S.checked[k]; else S.checked[k] = 1; save(); render(); }
  else if (cmd === 'uncheck') { S.checked = {}; S.extra.forEach(function (x) { x.done = false; }); save(); render(); }
  else if (cmd === 'xadd') { var v = $('xin').value.replace(/^\s+|\s+$/g, ''); if (v) { S.extra.push({t: v, done: false}); save(); render(); } }
  else if (cmd === 'xchk') { S.extra[+p[1]].done = !S.extra[+p[1]].done; save(); render(); }
  else if (cmd === 'xdel') { S.extra.splice(+p[1], 1); save(); render(); }
  else if (cmd === 'xclear') { S.extra = S.extra.filter(function (x) { return !x.done; }); save(); render(); toast('Quitados los añadidos marcados'); }
  else if (cmd === 'rplay') play(S.cfg.radios[+p[1]]);
  else if (cmd === 'rsplay') play(rres[+p[1]]);
  else if (cmd === 'rstop') stopRadio();
  else if (cmd === 'redit') { redit = !redit; render(); }
  else if (cmd === 'rmv') {
    var ri = +p[1], rj = ri + (+p[2]), rl = S.cfg.radios;
    if (rj < 0 || rj >= rl.length) return;
    var tmp = rl[ri]; rl[ri] = rl[rj]; rl[rj] = tmp; save(); render();
  }
  else if (cmd === 'rdel') { S.cfg.radios.splice(+p[1], 1); save(); render(); }
  else if (cmd === 'rfav') { var nr = rres[+p[1]]; S.cfg.radios.push({n: nr.n, u: nr.u, id: nr.id}); save(); render(); toast(nr.n + ' guardada'); }
  else if (cmd === 'rsearch') {
    var rq = $('rsq').value.replace(/^\s+|\s+$/g, ''); if (!rq) return;
    rres = null; $('rres').innerHTML = radioResults();
    var done = function (j) {
      rres = [];
      j.forEach(function (s) {
        var u = s.url_resolved || s.url;
        // La página va por https: las emisoras solo http no sonarían
        if (!/^https:/.test(u) || rres.length >= 20) return;
        var nm = s.name.replace(/^\s+|\s+$/g, '');
        rres.push({n: nm.length > 60 ? nm.slice(0, 57) + '…' : nm, u: u, id: s.stationuuid,
          d: [s.state, s.country, s.tags ? s.tags.split(',').slice(0, 3).join(', ') : ''].filter(function (x) { return x; }).join(' · ')});
      });
      var el = $('rres'); if (el) el.innerHTML = rres.length ? radioResults() : '<p class="mute">No he encontrado emisoras con ese nombre.</p>';
      $('rsq').value = rq;
    };
    var qs = encodeURIComponent(rq);
    rbGet('/json/stations/search?name=' + qs + '&order=clickcount&reverse=true&limit=60&hidebroken=true', function (j) {
      if (j.length) done(j);
      else rbGet('/json/stations/search?tag=' + qs + '&order=clickcount&reverse=true&limit=60&hidebroken=true', done, function () { done([]); });
    }, function () { rres = []; var el = $('rres'); if (el) el.innerHTML = '<p class="mute">Sin conexión con el buscador de emisoras.</p>'; });
  }
  else if (cmd === 'city') {
    var q = $('cc').value.replace(/^\s+|\s+$/g, ''); if (!q) return;
    getOpenMeteo('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name=' + encodeURIComponent(q), function (j) {
      if (!j.results || !j.results.length) { toast('No encuentro esa ciudad'); return; }
      var r = j.results[0]; S.cfg.city = {name: r.name, lat: r.latitude, lon: r.longitude}; wx = null; S.wx = null; save(); fetchWx(); render(); toast('Ciudad: ' + r.name);
    }, function () { toast('Sin conexión'); });
  }
  else if (cmd === 'fs') goFull();
  else if (cmd === 'savecfg') {
    var c = S.cfg;
    c.people = Math.max(1, Math.min(10, parseInt($('cp').value, 10) || 2));
    c.kcal = Math.max(1200, Math.min(3500, parseInt($('ck').value, 10) || 2000));
    c.diet = $('cd').value;
    c.excl = [];
    var xs = document.querySelectorAll('.cx');
    for (var i = 0; i < xs.length; i++) if (xs[i].checked) c.excl.push(xs[i].value);
    c.gcal = $('cg').value.replace(/\s/g, '');
    c.theme = $('ct').value;
    c.wake = $('cw').value;
    c.autofs = $('cfs').checked;
    delete c.playlists;
    save(); render(); updateWake(); toast('Ajustes guardados');
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'rq') { recQuery = e.target.value; $('rlist').innerHTML = recList(); }
});
document.addEventListener('keydown', function (e) {
  if (e.keyCode === 13 && e.target.id === 'xin') { var b = document.querySelector('[data-a="xadd"]'); if (b) b.click(); }
  if (e.keyCode === 13 && e.target.id === 'rsq') { var b2 = document.querySelector('[data-a="rsearch"]'); if (b2) b2.click(); }
  if (e.keyCode === 27) closeModal();
});

/* ---------- Reloj y tema ---------- */
var PAL = {
  light: {bg:'#f4f1ea',card:'#ffffff',ink:'#22262a',mute:'#6b7177',line:'#e3ded3',acc:'#2f7d5b',acc2:'#e6f1ea',warn:'#b5562b',warn2:'#f8e9e1'},
  dark:  {bg:'#111315',card:'#1b1e21',ink:'#ebe8e1',mute:'#9aa0a6',line:'#2c3034',acc:'#62c194',acc2:'#1d2b24',warn:'#e39368',warn2:'#33231b'}
};
var VARS_OK = !!(window.CSS && CSS.supports && CSS.supports('color', 'var(--a)'));
var BASE_CSS = $('base').textContent, curTheme = null;
function applyTheme() {
  var m = S.cfg.theme, hr = new Date().getHours();
  var t = (m === 'dark' || (m === 'auto' && (hr >= 21 || hr < 8))) ? 'dark' : 'light';
  document.body.className = t === 'dark' ? 'dark' : '';
  if (t === curTheme) return;
  curTheme = t;
  var p = PAL[t];
  if (VARS_OK) { for (var k in p) document.documentElement.style.setProperty('--' + k, p[k]); }
  else $('base').textContent = BASE_CSS.replace(/var\(--([a-z0-9]+)\)/g, function (all, k) { return p[k] || all; });
}
var lastDay = new Date().getDate();
setInterval(function () {
  var d = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if ($('clock')) $('clock').textContent = hm;
  if ($('date')) $('date').textContent = dateStr(d);
  if ($('navclock')) $('navclock').textContent = hm;
  applyTheme();
  if (d.getDate() !== lastDay) { lastDay = d.getDate(); if (view === 'home' || view === 'menu') render(); else ensurePlan(); }
}, 10000);
setInterval(fetchWx, 30 * 60 * 1000);

/* ---------- Pantalla encendida (Screen Wake Lock) ----------
   El navegador suelta el bloqueo al ocultar la página, así que se vuelve a pedir al volver, al tocar y cada minuto */
var wl = null;
function updateWake() {
  if (!navigator.wakeLock) return;
  var want = S.cfg.wake === 'always' || (S.cfg.wake === 'radio' && !!playing);
  if (!want) { if (wl && wl.release) wl.release(); wl = null; return; }
  if (wl || document.visibilityState !== 'visible') return;
  wl = 'pending';
  try {
    navigator.wakeLock.request('screen').then(function (l) {
      wl = l;
      l.addEventListener('release', function () { if (wl === l) wl = null; });
    }, function () { wl = null; });
  } catch (err) { wl = null; }
}
document.addEventListener('visibilitychange', updateWake);
setInterval(updateWake, 60000);

var au = $('au');
au.addEventListener('playing', function () { radioStatus('En directo'); updateWake(); });
au.addEventListener('pause', updateWake);
au.addEventListener('waiting', function () { radioStatus('Cargando…'); });
au.addEventListener('error', function () { if (au.getAttribute('src')) radioError(); });

load();
render();
fetchWx();
updateWake();
if (navigator.serviceWorker && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
